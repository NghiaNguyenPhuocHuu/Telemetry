# The Engine Room: This docker-compose file sets up the core services required for the telemetry system, 
# including an in-memory stream buffer (Redis) and a time-series/relational database (TimescaleDB). 
# It defines the necessary configurations, ports, volumes, and health checks for each service to ensure they run smoothly in a containerized environment.
version: "3.8"

services:
  # In-Memory Stream Buffer
  redis:
    image: redis:7-alpine
    container_name: telemetry_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Time-Series / Relational Database
  timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: telemetry_timescale
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  redis_data:
  timescale_data: